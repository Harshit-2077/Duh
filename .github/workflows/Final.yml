name: Build qca_cld3_qca6750.ko (Monitor + Injection)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/neutron-clang
      KERNEL_DIR:    ${{ github.workspace }}/kernel
      MODULES_DIR:   ${{ github.workspace }}/modules

      ARCH: arm64
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
      LLVM: 1
      LLVM_IAS: 1

      # ---- KERNEL CONFIG ---------------------------------------
      DEFCONFIG_BASE: gki_defconfig
      # Each token is a separate pattern; prefix arch/arm64/configs/ is
      # applied to EVERY token. Order matters: later overrides earlier.
      DEFCONFIG_FRAGMENTS_GLOB: "vendor/peridot_GKI.config vendor/pineapple_GKI.config"

      # ---- qcacld defconfig (must match the patched one) --------
      WLAN_DEFCONFIG: pineapple_gki_qca6750_defconfig

      # ---- caching --------------------------------------------
      CCACHE_DIR:     ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      TCACHE_VERSION: v1

    steps:
      # 1. Kernel ---------------------------------------------------
      - name: Checkout LineageOS kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm8635
          path: kernel
          fetch-depth: 1

      # 2. Patched modules -----------------------------------------
      - name: Checkout patched modules repo
        uses: actions/checkout@v4
        with:
          repository: Harshit-2077/android_kernel_xiaomi_sm8635-modules
          path: modules
          fetch-depth: 1

      # 3. Verify patch + config files ----------------------------
      - name: Verify patch and config files
        run: |
          set -e
          if ! grep -q "FEATURE_FRAME_INJECTION_SUPPORT" \
               "$MODULES_DIR/qcom/opensource/wlan/qcacld-3.0/Kbuild"; then
            echo "ERROR: module repo missing monitor/injection patch"; exit 1
          fi
          if ! grep -q "FEATURE_FRAME_INJECTION_SUPPORT" \
               "$MODULES_DIR/qcom/opensource/wlan/qcacld-3.0/configs/$WLAN_DEFCONFIG"; then
            echo "ERROR: $WLAN_DEFCONFIG missing FRAME_INJECTION support"; exit 1
          fi
          echo "OK: patch present"

          if [ ! -f "$KERNEL_DIR/arch/arm64/configs/$DEFCONFIG_BASE" ]; then
            echo "ERROR: base defconfig missing: arch/arm64/configs/$DEFCONFIG_BASE"
            exit 1
          fi

          MATCHED=0
          for pattern in $DEFCONFIG_FRAGMENTS_GLOB; do
            for f in "$KERNEL_DIR"/arch/arm64/configs/$pattern; do
              [ -f "$f" ] || continue
              echo "  fragment: ${f#$KERNEL_DIR/arch/arm64/configs/}"
              MATCHED=$((MATCHED + 1))
            done
          done
          if [ "$MATCHED" -eq 0 ]; then
            echo "ERROR: no fragments matched: $DEFCONFIG_FRAGMENTS_GLOB"
            exit 1
          fi
          echo "OK: $MATCHED fragment(s) detected"

      # 4. Dependencies (Ubuntu 24.04 verified) ------------------
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio \
            curl dwarves flex \
            g++-multilib gawk gcc-multilib \
            git git-lfs gnupg gperf \
            imagemagick kmod \
            lib32z1-dev libc6-dev-i386 \
            libelf-dev liblz4-tool \
            libncurses-dev libncurses5-dev libncursesw5-dev \
            libssl-dev libxml2 libxml2-utils \
            lzop pngcrush \
            python3 python-is-python3 \
            rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev zstd \
            openssl ca-certificates

      # 4b. Sanity: pahole must be available for BTF --------------
      - name: Verify pahole (BTF generator)
        run: |
          if ! command -v pahole >/dev/null 2>&1; then
            echo "::error::pahole not found (dwarves did not install correctly)"
            dpkg -L dwarves 2>/dev/null | grep -E 'pahole|bin/' || true
            exit 1
          fi
          echo "pahole: $(command -v pahole)"
          pahole --version

      # 5a. Toolchain cache restore -------------------------------
      - name: Restore Neutron Clang
        id: tc-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: neutron-clang-${{ runner.os }}-${{ env.TCACHE_VERSION }}-${{ github.run_id }}
          restore-keys: |
            neutron-clang-${{ runner.os }}-${{ env.TCACHE_VERSION }}-

      # 5b. Download only on cache miss ---------------------------
      - name: Fetch Neutron Clang (cache miss)
        if: steps.tc-restore.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TOOLCHAIN_DIR"
          cd "$TOOLCHAIN_DIR"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc

      # 5c. Save toolchain ---------------------------------------
      - name: Save Neutron Clang
        if: steps.tc-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: neutron-clang-${{ runner.os }}-${{ env.TCACHE_VERSION }}-${{ github.run_id }}

      - name: Add toolchain to PATH
        run: echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

      # 6. ccache restore -----------------------------------------
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.DEFCONFIG_BASE }}-${{ github.sha }}-r${{ github.run_id }}a${{ github.run_attempt }}-m
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEFCONFIG_BASE }}-${{ github.sha }}-
            ccache-${{ runner.os }}-${{ env.DEFCONFIG_BASE }}-

      # 7. Integrate patched WLAN source --------------------------
      - name: Integrate patched WLAN source
        run: |
          set -e
          KWLAN="$KERNEL_DIR/qcom/opensource/wlan"
          MWLAN="$MODULES_DIR/qcom/opensource/wlan"

          if [ -d "$KWLAN/qcacld-3.0" ]; then
            rm -rf "$KWLAN"; cp -a "$MWLAN" "$KWLAN"
          elif [ -L "$KERNEL_DIR/drivers/staging/qcacld-3.0" ]; then
            T1=$(readlink -f "$KERNEL_DIR/drivers/staging/qcacld-3.0")
            T2=$(readlink -f "$KERNEL_DIR/drivers/staging/qca-wifi-host-cmn")
            rm -rf "$T1" "$T2"
            cp -a "$MWLAN/qcacld-3.0"        "$T1"
            cp -a "$MWLAN/qca-wifi-host-cmn" "$T2"
          elif [ -d "$KERNEL_DIR/drivers/staging/qcacld-3.0" ]; then
            rm -rf "$KERNEL_DIR/drivers/staging/qcacld-3.0" \
                   "$KERNEL_DIR/drivers/staging/qca-wifi-host-cmn"
            cp -a "$MWLAN/qcacld-3.0"        \
                  "$KERNEL_DIR/drivers/staging/qcacld-3.0"
            cp -a "$MWLAN/qca-wifi-host-cmn" \
                  "$KERNEL_DIR/drivers/staging/qca-wifi-host-cmn"
          else
            mkdir -p "$KERNEL_DIR/qcom/opensource"
            cp -a "$MWLAN" "$KWLAN"
            ln -sfn ../../qcom/opensource/wlan/qcacld-3.0 \
                    "$KERNEL_DIR/drivers/staging/qcacld-3.0"
            ln -sfn ../../qcom/opensource/wlan/qca-wifi-host-cmn \
                    "$KERNEL_DIR/drivers/staging/qca-wifi-host-cmn"
          fi
          if ! grep -q "qcacld-3.0" "$KERNEL_DIR/drivers/staging/Makefile" 2>/dev/null; then
            echo 'obj-$(CONFIG_QCA_CLD_WLAN) += qcacld-3.0/' \
              >> "$KERNEL_DIR/drivers/staging/Makefile"
          fi

      # 8. Fix OpenSSL 3.0 key_pass on Ubuntu 24.04 ---------------
      - name: Patch OpenSSL 3.0 key_pass issue
        run: |
          ROOT="$KERNEL_DIR"
          if [[ -f "$ROOT/certs/extract-cert.c" ]]; then
            sed -i '/static.*key_pass/d' "$ROOT/certs/extract-cert.c"
            sed -i '1i __attribute__((unused)) static const char *key_pass;' \
                  "$ROOT/certs/extract-cert.c"
            echo "Patched certs/extract-cert.c for OpenSSL 3.0 (key_pass unused)"
          else
            echo "certs/extract-cert.c not present, skipping"
          fi

      # 9. Configure: base + auto-detected fragments + overrides --
      - name: Configure kernel
        run: |
          set -e
          cd "$KERNEL_DIR"

          echo "== Base: $DEFCONFIG_BASE =="
          make O=out ARCH=$ARCH $DEFCONFIG_BASE

          FRAGMENTS=""
          for pattern in $DEFCONFIG_FRAGMENTS_GLOB; do
            for f in "$KERNEL_DIR"/arch/arm64/configs/$pattern; do
              [ -f "$f" ] || continue
              rel="${f#$KERNEL_DIR/arch/arm64/configs/}"
              FRAGMENTS="$FRAGMENTS $rel"
            done
          done
          if [ -z "$FRAGMENTS" ]; then
            echo "ERROR: no fragments matched: $DEFCONFIG_FRAGMENTS_GLOB"; exit 1
          fi
          echo "== Fragments:$FRAGMENTS =="
          make O=out ARCH=$ARCH $FRAGMENTS

          echo "== Overrides =="
          # no module signatures
          scripts/config --file out/.config -d MODULE_SIG
          scripts/config --file out/.config -d MODULE_SIG_ALL
          scripts/config --file out/.config -d MODULE_SIG_FORCE
          # ThinLTO
          scripts/config --file out/.config -e LTO_CLANG
          scripts/config --file out/.config -e LTO_CLANG_THIN
          scripts/config --file out/.config -d LTO_NONE
          # BTF disabled (CI-safe with LTO; .ko doesn't need it)
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          scripts/config --file out/.config -d DEBUG_INFO_BTF_MODULES
          # build WLAN as module
          scripts/config --file out/.config -m QCA_CLD_WLAN
          # ccache
          scripts/config --file out/.config -e CCACHE

          make O=out ARCH=$ARCH olddefconfig

          echo "== Verify =="
          grep -E "CONFIG_(ARM64|QCA_CLD_WLAN|LTO_CLANG_THIN|MODULE_SIG|DEBUG_INFO_BTF)" \
              out/.config | sort || true

      # 10. Kernel image ------------------------------------------
      - name: Build kernel image
        run: |
          cd "$KERNEL_DIR"
          make -j$(nproc) \
            O=out ARCH=$ARCH \
            CC=$CC CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
            LLVM=$LLVM LLVM_IAS=$LLVM_IAS \
            USE_CCACHE=1 CCACHE_EXEC=$(which ccache) \
            Image

      # 10b. SAVE CCACHE AFTER KERNEL -----------------------------
      - name: Save ccache (after kernel)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.DEFCONFIG_BASE }}-${{ github.sha }}-r${{ github.run_id }}a${{ github.run_attempt }}-k

      # 11. Modules -----------------------------------------------
      - name: Build WLAN modules
        run: |
          cd "$KERNEL_DIR"
          make -j$(nproc) \
            O=out ARCH=$ARCH \
            CC=$CC CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
            LLVM=$LLVM LLVM_IAS=$LLVM_IAS \
            USE_CCACHE=1 CCACHE_EXEC=$(which ccache) \
            WLAN_DEFCONFIG=$WLAN_DEFCONFIG \
            modules

      # 11b. SAVE CCACHE AFTER MODULES ----------------------------
      - name: Save ccache (after modules)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.DEFCONFIG_BASE }}-${{ github.sha }}-r${{ github.run_id }}a${{ github.run_attempt }}-m

      # 12. Verify -------------------------------------------------
      - name: Locate qca_cld3_qca6750.ko
        run: |
          FOUND=$(find "$KERNEL_DIR/out" -name "qca_cld3_qca6750.ko" -type f)
          if [ -z "$FOUND" ]; then
            echo "ERROR: qca_cld3_qca6750.ko not produced"
            find "$KERNEL_DIR/out" -name "*.ko" -type f || true
            exit 1
          fi
          echo "Found:"; echo "$FOUND"

      # 13. Upload ------------------------------------------------
      - name: Upload qca_cld3_qca6750.ko
        uses: actions/upload-artifact@v4
        with:
          name: qca_cld3_qca6750-ko
          path: kernel/out/**/qca_cld3_qca6750.ko
          if-no-files-found: error
